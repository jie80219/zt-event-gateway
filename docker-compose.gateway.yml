name: zt-gateway-app
# ─────────────────────────────────────────────────────────────────────
# Application stack: spire-agent (co-located) + gateway + worker +
# load-balance monitor/recalc.
#
# Prerequisite:
#   docker compose -f docker-compose.spire.yml up -d
#
# Then start:
#   docker compose -f docker-compose.gateway.yml up -d
#
# Cross-host deployment:
#   Set PLATFORM_HOST to the reachable host of the platform stack
#   (defaults to the docker-network service names when on the same host).
# ─────────────────────────────────────────────────────────────────────

services:

  # ── SPIRE Agent (must be co-located with the workloads via UDS) ───
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.12.0
    container_name: zt-spire-agent
    command:
      - -config
      - /opt/spire/conf/agent/agent.conf
    volumes:
      - ./spiffe/spire-agent-e2e/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - ./spiffe/certs/agent.key.pem:/opt/spire/conf/agent/agent.key.pem:ro
      - ./spiffe/certs/agent.crt.pem:/opt/spire/conf/agent/agent.crt.pem:ro
      - spire-agent-sockets:/run/spire/sockets
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks:
      - zt-net

  # ── Gateway (OpenSwoole HTTP server) ──────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: docker/php-openswoole/Dockerfile
    container_name: zt-gateway
    command: ["php", "bin/gateway.php"]
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      GATEWAY_WORKERS: "2"
      RABBITMQ_HOST: "${PLATFORM_HOST:-rabbitmq}"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "zt"
      RABBITMQ_PASS: "ztpass"
      SPIFFE_ID: "spiffe://zt.local/php-gateway"
      SPIFFE_ENDPOINT_SOCKET: "unix:/run/spire/sockets/agent.sock"
      WORKER_SPIFFE_ID: "spiffe://zt.local/php-worker"
      LSVID_ENABLED: "1"
      SPIFFE_SHM_DIR: "/tmp/spiffe-shared"
    volumes:
      - spire-agent-sockets:/run/spire/sockets:ro
      - spiffe-shared:/tmp/spiffe-shared
    ports:
      - "8080:8080"
    depends_on:
      spire-agent:
        condition: service_healthy
    networks:
      - zt-net

  # ── PHP Worker (Saga / Event consumer) ────────────────────────────
  php-worker:
    build:
      context: .
      dockerfile: docker/php-openswoole/Dockerfile
    container_name: zt-php-worker
    command: ["php", "bin/worker.php"]
    environment:
      APP_SERVICE_NAME: php-worker
      AMQP_HOST: "${PLATFORM_HOST:-rabbitmq}"
      AMQP_PORT: "5672"
      AMQP_USER: "zt"
      AMQP_PASSWORD: "ztpass"
      RABBITMQ_HOST: "${PLATFORM_HOST:-rabbitmq}"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "zt"
      RABBITMQ_PASS: "ztpass"
      SPIFFE_ID: "spiffe://zt.local/php-worker"
      SPIFFE_ENDPOINT_SOCKET: "unix:/run/spire/sockets/agent.sock"
      DOWNSTREAM_SPIFFE_ID: "spiffe://zt.local/php-worker"
      LSVID_ENABLED: "1"
      LSVID_REQUIRED: "0"
      SPIFFE_SHM_DIR: "/tmp/spiffe-shared"
      # ── mTLS to downstream services ──
      SPIFFE_MTLS_ENABLED: "1"
      MTLS_PORT: "8443"
      ORDER_SERVICE_HOST: "zt-order-service"
      PRODUCTION_SERVICE_HOST: "zt-production-service"
      USER_SERVICE_HOST: "zt-user-service"
      ORDER_SPIFFE_ID: "spiffe://zt.local/order-service"
      PRODUCTION_SPIFFE_ID: "spiffe://zt.local/production-service"
      USER_SPIFFE_ID: "spiffe://zt.local/user-service"
    volumes:
      - spire-agent-sockets:/run/spire/sockets:ro
      - spiffe-shared:/tmp/spiffe-shared
    depends_on:
      spire-agent:
        condition: service_healthy
    networks:
      - zt-net

  # ── Load-Balance Monitor ──────────────────────────────────────────
  monitor:
    build:
      context: ./anser-gateway
      dockerfile: Dockerfile
    container_name: zt-lb-monitor
    working_dir: /app
    command: ["sh", "-c", "composer install --no-interaction --prefer-dist && php monitor/monitor_trigger.php"]
    environment:
      LOAD_BALANCE_AMQP_HOST: "${PLATFORM_HOST:-rabbitmq}"
      LOAD_BALANCE_AMQP_PORT: "5672"
      LOAD_BALANCE_AMQP_USER: "zt"
      LOAD_BALANCE_AMQP_PASSWORD: "ztpass"
      REDIS_HOST: "${PLATFORM_HOST:-redis}"
      REDIS_PORT: "6379"
    volumes:
      - ./anser-gateway:/app
    restart: unless-stopped
    networks:
      - zt-net

  # ── Load-Balance Recalc Worker ────────────────────────────────────
  recalc-worker:
    build:
      context: ./anser-gateway
      dockerfile: Dockerfile
    container_name: zt-lb-recalc-worker
    working_dir: /app
    command: ["sh", "-c", "composer install --no-interaction --prefer-dist && php worker/recalc_worker.php"]
    environment:
      LOAD_BALANCE_AMQP_HOST: "${PLATFORM_HOST:-rabbitmq}"
      LOAD_BALANCE_AMQP_PORT: "5672"
      LOAD_BALANCE_AMQP_USER: "zt"
      LOAD_BALANCE_AMQP_PASSWORD: "ztpass"
      REDIS_HOST: "${PLATFORM_HOST:-redis}"
      REDIS_PORT: "6379"
    volumes:
      - ./anser-gateway:/app
    restart: unless-stopped
    networks:
      - zt-net

volumes:
  # Created by docker-compose.spire.yml; consume as external here.
  spire-agent-sockets:
    external: true
    name: zt-spire-agent-sockets
  spiffe-shared:
    external: true
    name: zt-spiffe-shared

networks:
  zt-net:
    external: true
    name: zt-net
