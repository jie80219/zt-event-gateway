admin:
  ip: 0.0.0.0
  port: 9990

namers:
  - kind: io.l5d.fs
    rootDir: /var/linkerd/disco

telemetry:
  - kind: io.l5d.prometheus
  - kind: io.l5d.zipkin
    host: HOST_A_IP
    port: 9411
    sampleRate: 1.0

usage:
  enabled: false

routers:
  - protocol: http
    label: incoming
    servers:
      - port: 4141
        ip: 0.0.0.0
        # Phase 3 — uncomment.
        # tls:
        #   certPath: /var/linkerd/tls/host-d.crt
        #   keyPath:  /var/linkerd/tls/host-d.key
        #   requireClientAuth: true
        #   caCertPath: /var/linkerd/tls/ca.crt
    identifier:
      kind: io.l5d.header.token
      header: Host
    dtab: |
      /svc => /#/io.l5d.fs ;
      /svc/UserService => /#/io.l5d.fs/UserService ;
