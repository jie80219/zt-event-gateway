## Disable default guest user entirely
default_user = zt
default_pass = ztpass

## Allow zt user from any network (not just loopback)
loopback_users = none

## Load definitions on startup (queues, exchanges, etc. — NOT users)
## Users are managed by default_user above
# management.load_definitions = /etc/rabbitmq/definitions.json

## Logging
log.console = true
log.console.level = info
