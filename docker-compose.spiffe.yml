# ══════════════════════════════════════════════════════════════════
#  SPIFFE E2E Test Environment
#
#  Architecture:
#
#    ┌─────────────────────────────────────────────────────────┐
#    │                 Docker Network: spiffe-e2e               │
#    │                                                         │
#    │  ┌─────────────┐       ┌─────────────┐                │
#    │  │ spire-server │◀─────│ spire-agent  │               │
#    │  │ :8081 (gRPC) │       │              │               │
#    │  └──────┬───────┘       └──────┬───────┘               │
#    │         │                       │                       │
#    │         │  shared vol           │  agent.sock           │
#    │         │  (join token)         │  (Workload API)       │
#    │         ▼                       ▼                       │
#    │  ┌─────────────────────────────────────────┐           │
#    │  │         php-spiffe-e2e                   │           │
#    │  │  (test-e2e.php via Swoole gRPC client)   │           │
#    │  │                                          │           │
#    │  │  FetchX509SVID ──▶ X509Svid entity       │           │
#    │  │  FetchJWTSVID  ──▶ JwtSvid entity        │           │
#    │  │  Validation    ──▶ X509SvidValidator      │           │
#    │  │  AuthPolicy    ──▶ AuthorizationPolicy    │           │
#    │  └──────────────────────────────────────────┘           │
#    └─────────────────────────────────────────────────────────┘
#
#  Usage:
#
#    # Start the environment
#    docker compose -f docker-compose.spiffe.yml up -d spire-server
#
#    # Wait for server, then bootstrap (generate token + register workloads)
#    docker compose -f docker-compose.spiffe.yml exec spire-server \
#        /opt/spire/conf/e2e/bootstrap.sh
#
#    # Start agent (reads join token from shared volume)
#    docker compose -f docker-compose.spiffe.yml up -d spire-agent
#
#    # Run E2E tests
#    docker compose -f docker-compose.spiffe.yml up php-spiffe-e2e
#
#    # Or all-in-one:
#    ./spiffe/e2e/run-e2e.sh
#
#    # Tear down
#    docker compose -f docker-compose.spiffe.yml down -v
# ══════════════════════════════════════════════════════════════════

name: zt-spiffe-e2e

services:
  # ────────────────────────────────────────────────────────────
  #  SPIRE Server — trust domain root, issues SVIDs
  # ────────────────────────────────────────────────────────────
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.12.0
    container_name: spire-server
    command:
      - -config
      - /opt/spire/conf/server/server.conf
    volumes:
      - ./spiffe/spire-server-e2e/server.conf:/opt/spire/conf/server/server.conf:ro
      - ./spiffe/e2e/bootstrap.sh:/opt/spire/conf/e2e/bootstrap.sh:ro
      - spire-shared:/opt/spire/conf/shared
      - spire-server-data:/opt/spire/data/server
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - spiffe-e2e

  # ────────────────────────────────────────────────────────────
  #  SPIRE Agent — node-level, serves Workload API over UDS
  # ────────────────────────────────────────────────────────────
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.12.0
    container_name: spire-agent
    entrypoint: ["/bin/sh", "/opt/spire/conf/e2e/agent-entrypoint.sh"]
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - ./spiffe/spire-agent-e2e/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - ./spiffe/e2e/agent-entrypoint.sh:/opt/spire/conf/e2e/agent-entrypoint.sh:ro
      - spire-shared:/opt/spire/conf/shared
      - spire-agent-sockets:/run/spire/sockets
      - spire-agent-data:/opt/spire/data/agent
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks:
      - spiffe-e2e

  # ────────────────────────────────────────────────────────────
  #  PHP E2E Test Runner — connects to SPIRE Agent via UDS
  # ────────────────────────────────────────────────────────────
  php-spiffe-e2e:
    build:
      context: .
      dockerfile: docker/php-spiffe/Dockerfile
    container_name: php-spiffe-e2e
    depends_on:
      spire-agent:
        condition: service_healthy
    environment:
      SPIFFE_ENDPOINT_SOCKET: "unix:/run/spire/sockets/agent.sock"
      SPIFFE_TRUST_DOMAIN: "zt.local"
      SPIFFE_E2E_WAIT: "60"
    volumes:
      - spire-agent-sockets:/run/spire/sockets:ro
      - spire-shared:/opt/spire/conf/shared:ro
    command: ["php", "spiffe/e2e/test-e2e.php"]
    networks:
      - spiffe-e2e

volumes:
  spire-shared:
  spire-server-data:
  spire-agent-data:
  spire-agent-sockets:

networks:
  spiffe-e2e:
    driver: bridge
