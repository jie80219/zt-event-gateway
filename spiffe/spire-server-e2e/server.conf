server {
    bind_address = "0.0.0.0"
    bind_port    = "8081"
    socket_path  = "/tmp/spire-server/private/api.sock"
    trust_domain = "zt.local"
    data_dir     = "/opt/spire/data/server"
    log_level    = "INFO"

    ca_subject = {
        country      = ["TW"]
        organization = ["ZT-E2E"]
        common_name  = ""
    }

    # Short-lived SVIDs for fast rotation testing
    ca_ttl        = "24h"
    default_x509_svid_ttl = "1h"
    default_jwt_svid_ttl  = "5m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }

    # join_token attestation — simplest for E2E testing
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    UpstreamAuthority "disk" {
        plugin_data {
            key_file_path  = "/opt/spire/conf/server/ca.key.pem"
            cert_file_path = "/opt/spire/conf/server/ca.crt.pem"
        }
    }
}
