name: CI

# Pipeline scope:
#   • unit-tests   — fast PHPUnit feedback, no Docker.
#   • e2e-baseline — Boots gateway + worker + RabbitMQ + EventStoreDB and
#                     exercises the canonical envelope + Saga compensation.
#   • e2e-linkerd  — Opt-in: layers docker-compose.linkerd.yml on top of the
#                     baseline stack, asserts mesh observability. Triggered by
#                     `workflow_dispatch` or commits containing `[linkerd-ci]`.

on:
  push:
    branches: [main, "feat/**", "fix/**", "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e_runs:
        description: "E2E repetitions per job (stability)"
        default: "1"
        required: false

env:
  PHP_VERSION: "8.3"
  COMPOSER_NO_INTERACTION: "1"

jobs:
  unit-tests:
    name: Unit tests (PHPUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, bcmath, json, sockets, pcntl
          coverage: none
          tools: composer:v2

      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit -c phpunit.xml

  e2e-baseline:
    name: E2E — Baseline
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    env:
      CI_MODE: baseline
      E2E_RUNS: ${{ github.event.inputs.e2e_runs || '1' }}
      E2E_DIAG_LEVEL: full
      CI_SKIP_UNIT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP (host helpers in ci-verify.sh)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Docker info
        run: |
          docker version
          docker compose version

      - name: Create external network
        run: docker network create anser_project_network || true

      - name: Run baseline CI
        run: bash scripts/ci-verify.sh

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-baseline-artifacts
          path: artifacts/ci/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true

  e2e-linkerd:
    name: E2E — Linkerd 1.x mesh
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[linkerd-ci]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Docker info
        run: |
          docker version
          docker compose version

      - name: Create external network
        run: docker network create anser_project_network || true

      - name: Run e2e in linkerd mode
        run: bash scripts/e2e-gateway.sh --mode=linkerd

      - name: Upload linkerd logs on failure
        if: failure()
        run: |
          mkdir -p artifacts/linkerd-ci
          docker compose -f docker-compose.yml -f docker-compose.linkerd.yml logs --no-color linkerd zipkin > artifacts/linkerd-ci/mesh.log 2>&1 || true

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-linkerd-artifacts
          path: artifacts/linkerd-ci/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.linkerd.yml down -v --remove-orphans || true

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-baseline]
    if: always()
    steps:
      - name: Report aggregate status
        run: |
          u='${{ needs.unit-tests.result }}'
          b='${{ needs.e2e-baseline.result }}'
          echo "unit-tests: $u"
          echo "e2e-baseline: $b"
          if [ "$u" != "success" ] || [ "$b" != "success" ]; then
            exit 1
          fi
