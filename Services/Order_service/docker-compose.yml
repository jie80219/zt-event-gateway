services:
    # ── vault-agent sidecar ─────────────────────────────────────────
    # Authenticates to Vault via AppRole and renders the service's
    # Vault-issued mTLS material to a shared volume:
    #   /vault/out/tls.crt  (leaf cert + issuing CA chain)
    #   /vault/out/tls.key  (private key)
    #   /vault/out/ca.crt   (trust bundle for verifying the client cert)
    order-svc-vault-agent:
        image: hashicorp/vault:1.18
        container_name: order-svc-vault-agent
        command: sh -c "chown -R vault:vault /vault/out; exec docker-entrypoint.sh agent -config=/vault/config.hcl"
        environment:
            - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
        volumes:
            - ../../docker/vault-pki/agent/order-svc.hcl:/vault/config.hcl:ro
            - ../../docker/vault-pki/creds:/vault/creds:ro
            - order-svc-vault-out:/vault/out
        restart: unless-stopped
        networks:
            - anser_project_network

    # ── Order Service ───────────────────────────────────────────────
    order-service:
        image: webdevops/php:8.2
        platform: linux/x86_64
        networks:
            - anser_project_network
        ports:
            - 8082:8080
            - 18082:8443
        working_dir: /app
        environment:
            - WEB_DOCUMENT_ROOT=/app/public
            - PHP_MEMORY_LIMIT=2048M
            - PHP_MAX_EXECUTION_TIME=300
            - PHP_POST_MAX_SIZE=2048M
            - PHP_UPLOAD_MAX_FILESIZE=2048M
        volumes:
            - './app:/app'
            # Bind packages/ so vendor/jie80219/php-lsvid symlink resolves.
            - '../../packages:/packages:ro'
            - order-svc-vault-out:/vault/out:ro
        command: >
            bash -c "until [ -s /vault/out/tls.crt ]; do echo '[order-service] waiting for /vault/out/tls.crt ...'; sleep 0.2; done; chmod 776 ./start_service.sh && ./start_service.sh"
        depends_on:
            order-svc-vault-agent:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://127.0.0.1:8080/ | grep -qE '^[2-4]'"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 120s
        restart: unless-stopped

    order_DB:
        image: postgres:11.12
        security_opt:
            - apparmor=unconfined
            - seccomp=unconfined
        networks:
            anser_project_network:
                aliases:
                    - devDB
        environment:
            POSTGRES_DB: order
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
        ports:
            - 8320:5432
        volumes:
            - ./order-db-data:/var/lib/postgresql/data/
        restart: unless-stopped
        command:
            [
                "postgres",
                "-c",
                "logging_collector=on",
                "-c",
                "log_destination=stderr",
                "-c",
                "max_connections=50000"
            ]

volumes:
    order-svc-vault-out:

networks:
    anser_project_network:
        external: true
