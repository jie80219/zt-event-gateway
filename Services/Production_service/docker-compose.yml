services:
    # ── Production Service ──────────────────────────────────────────
    production-service:
        image: webdevops/php:8.2
        platform: linux/x86_64
        networks:
            - anser_project_network
        ports:
            - 8083:8080
        working_dir: /app
        environment:
            - WEB_DOCUMENT_ROOT=/app/public
            - PHP_MEMORY_LIMIT=2048M
            - PHP_MAX_EXECUTION_TIME=300
            - PHP_POST_MAX_SIZE=2048M
            - PHP_UPLOAD_MAX_FILESIZE=2048M
        volumes:
            - './app:/app'
        command: >
            bash -c "chmod 776 ./start_service.sh && ./start_service.sh"
        healthcheck:
            test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://127.0.0.1:8080/ | grep -qE '^[2-4]'"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 120s
        restart: unless-stopped

    production_DB:
        image: postgres:11.12
        networks:
            - anser_project_network
        restart: unless-stopped
        environment:
            POSTGRES_DB: production
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
        volumes:
            - ./production-db-data:/var/lib/postgresql/data/
        ports:
            - "8310:5432"
        command:
            [
                "postgres",
                "-c",
                "logging_collector=on",
                "-c",
                "log_destination=stderr",
                "-c",
                "max_connections=50000"
            ]

networks:
    anser_project_network:
        external: true
