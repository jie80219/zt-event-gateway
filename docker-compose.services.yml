name: zt-services
# ─────────────────────────────────────────────────────────────────────
# Downstream Service stack with SPIFFE mTLS support.
#
# Each service runs with a spiffe-helper sidecar that fetches X.509-SVID
# from the SPIRE Agent and writes PEM files to a shared volume. RoadRunner
# picks up the PEM files to serve HTTPS with mutual TLS (client cert
# verification).
#
# Prerequisites:
#   docker compose -f docker-compose.spire.yml up -d
#   docker compose -f docker-compose.gateway.yml up -d
#
# Start:
#   docker compose -f docker-compose.services.yml up -d
#
# Architecture:
#
#   ┌──────────────┐     ┌──────────────────┐     ┌──────────────┐
#   │ spire-agent  │────▶│  spiffe-helper    │────▶│  /certs/     │
#   │ (UDS socket) │     │  (writes PEM)     │     │  svid.pem    │
#   └──────────────┘     └──────────────────┘     │  svid_key.pem│
#                                                  │  bundle.pem  │
#                                                  └──────┬───────┘
#                                                         │ mount
#                                                  ┌──────▼───────┐
#                                                  │  RoadRunner   │
#                                                  │  :8443 mTLS   │
#                                                  │  :8080 HTTP   │
#                                                  └──────────────┘
# ─────────────────────────────────────────────────────────────────────

services:

  # ── Order Service ─────────────────────────────────────────────────

  order-helper:
    image: ghcr.io/spiffe/spiffe-helper:0.8
    container_name: zt-order-helper
    command: ["-config", "/opt/spiffe-helper/helper.conf"]
    volumes:
      - ./spiffe/helper/order-service.conf:/opt/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/sockets:ro
      - order-certs:/certs
    depends_on:
      spire-agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zt-net

  order-service:
    image: webdevops/php:8.1
    platform: linux/x86_64
    container_name: zt-order-service
    working_dir: /app
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      PHP_MEMORY_LIMIT: 2048M
      PHP_MAX_EXECUTION_TIME: 300
      PHP_POST_MAX_SIZE: 2048M
      PHP_UPLOAD_MAX_FILESIZE: 2048M
      # ── SPIFFE / LSVID ──
      SPIFFE_ID: "spiffe://zt.local/order-service"
      SPIFFE_SHM_DIR: "/certs"
      LSVID_REQUIRED: "0"
    volumes:
      - ./Services/OrderService/app:/app
      - order-certs:/certs:ro
    ports:
      - "8082:8080"
      - "18082:8443"
    command: >
      bash -c "chmod 776 ./start_service.sh && ./start_service.sh"
    depends_on:
      - order-helper
    networks:
      - zt-net

  order-db:
    image: postgres:11.12
    container_name: zt-order-db
    environment:
      POSTGRES_DB: order
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "8320:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data/
    command:
      ["postgres", "-c", "logging_collector=on", "-c", "log_destination=stderr", "-c", "max_connections=50000"]
    networks:
      - zt-net

  # ── Production Service ────────────────────────────────────────────

  production-helper:
    image: ghcr.io/spiffe/spiffe-helper:0.8
    container_name: zt-production-helper
    command: ["-config", "/opt/spiffe-helper/helper.conf"]
    volumes:
      - ./spiffe/helper/production-service.conf:/opt/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/sockets:ro
      - production-certs:/certs
    depends_on:
      spire-agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zt-net

  production-service:
    image: webdevops/php:8.1
    platform: linux/x86_64
    container_name: zt-production-service
    working_dir: /app
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      PHP_MEMORY_LIMIT: 2048M
      PHP_MAX_EXECUTION_TIME: 300
      PHP_POST_MAX_SIZE: 2048M
      PHP_UPLOAD_MAX_FILESIZE: 2048M
      # ── SPIFFE / LSVID ──
      SPIFFE_ID: "spiffe://zt.local/production-service"
      SPIFFE_SHM_DIR: "/certs"
      LSVID_REQUIRED: "0"
    volumes:
      - ./Services/ProductionService/app:/app
      - production-certs:/certs:ro
    ports:
      - "8081:8080"
      - "18081:8443"
    command: >
      bash -c "chmod 776 ./start_service.sh && ./start_service.sh"
    depends_on:
      - production-helper
    networks:
      - zt-net

  production-db:
    image: postgres:11.12
    container_name: zt-production-db
    environment:
      POSTGRES_DB: production
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "8310:5432"
    volumes:
      - production-db-data:/var/lib/postgresql/data/
    command:
      ["postgres", "-c", "logging_collector=on", "-c", "log_destination=stderr", "-c", "max_connections=50000"]
    networks:
      - zt-net

  # ── User Service ──────────────────────────────────────────────────

  user-helper:
    image: ghcr.io/spiffe/spiffe-helper:0.8
    container_name: zt-user-helper
    command: ["-config", "/opt/spiffe-helper/helper.conf"]
    volumes:
      - ./spiffe/helper/user-service.conf:/opt/spiffe-helper/helper.conf:ro
      - spire-agent-sockets:/run/spire/sockets:ro
      - user-certs:/certs
    depends_on:
      spire-agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zt-net

  user-service:
    image: webdevops/php:8.1
    platform: linux/x86_64
    container_name: zt-user-service
    working_dir: /app
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      PHP_MEMORY_LIMIT: 2048M
      PHP_MAX_EXECUTION_TIME: 300
      PHP_POST_MAX_SIZE: 2048M
      PHP_UPLOAD_MAX_FILESIZE: 2048M
      # ── SPIFFE / LSVID ──
      SPIFFE_ID: "spiffe://zt.local/user-service"
      SPIFFE_SHM_DIR: "/certs"
      LSVID_REQUIRED: "0"
    volumes:
      - ./Services/UserService/app:/app
      - user-certs:/certs:ro
    ports:
      - "8083:8080"
      - "18083:8443"
    command: >
      bash -c "chmod 776 ./start_service.sh && ./start_service.sh"
    depends_on:
      - user-helper
    networks:
      - zt-net

  user-db:
    image: postgres:11.12
    container_name: zt-user-db
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "8340:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data/
    command:
      ["postgres", "-c", "logging_collector=on", "-c", "log_destination=stderr", "-c", "max_connections=10000"]
    networks:
      - zt-net

  # ── SPIRE Agent (reference from gateway stack) ────────────────────
  # Required so spiffe-helper sidecars can depend on it. If the agent
  # is already running from docker-compose.gateway.yml, this is a
  # no-op duplicate that Docker Compose merges by container_name.
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.12.0
    container_name: zt-spire-agent
    command:
      - -config
      - /opt/spire/conf/agent/agent.conf
    volumes:
      - ./spiffe/spire-agent-e2e/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - ./spiffe/certs/agent.key.pem:/opt/spire/conf/agent/agent.key.pem:ro
      - ./spiffe/certs/agent.crt.pem:/opt/spire/conf/agent/agent.crt.pem:ro
      - spire-agent-sockets:/run/spire/sockets
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks:
      - zt-net

volumes:
  order-certs:
  production-certs:
  user-certs:
  order-db-data:
  production-db-data:
  user-db-data:
  spire-agent-sockets:
    external: true
    name: zt-spire-agent-sockets

networks:
  zt-net:
    external: true
    name: zt-net
