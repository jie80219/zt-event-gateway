name: zt-event-gateway
services:

  # ── Infrastructure ──────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: zt-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - anser_project_network

  eventstoredb:
    container_name: eventstoredb
    image: eventstore/eventstore:latest
    environment:
        EVENTSTORE_CLUSTER_SIZE: 1
        EVENTSTORE_RUN_PROJECTIONS: All
        EVENTSTORE_START_STANDARD_PROJECTIONS: "true"
        EVENTSTORE_INSECURE: "true"
        EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: "true"
    ports:
        - '1113:1113' # TCP 客戶端通信
        - '2113:2113' # HTTP API 接口
    networks:
        - anser_project_network

  # ── Application (OpenSwoole) ────────────────────────────────────
  #
  # Service identity is transport-layer Vault PKI mTLS only. The
  # vault-agent sidecar (docker/vault-pki/) renders per-service X.509 to
  # /vault/out/{tls.crt,tls.key,ca.crt}; the worker reads them when
  # VAULT_MTLS_ENABLED=1. There is no SPIFFE Workload API, no SPIRE, no
  # LSVID, and no Keycloak in this stack.

  gateway:
    build:
      context: .
      dockerfile: docker/php-openswoole/Dockerfile
    container_name: zt-gateway
    command: ["php", "bin/gateway.php"]
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      GATEWAY_WORKERS: "${GATEWAY_WORKERS:-32}"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "zt"
      RABBITMQ_PASS: "ztpass"
      EVENTSTOREDB_HOST: eventstoredb
      EVENTSTOREDB_PORT: 2113
      # AMQP message persistence — default 0 (transient, latency-optimised).
      # Set AMQP_PERSISTENT=1 to write every message to disk; queues remain
      # durable either way, so broker restart only loses in-flight messages.
      AMQP_PERSISTENT: "${AMQP_PERSISTENT:-0}"
      GATEWAY_AMQP_POOL_SIZE: "${GATEWAY_AMQP_POOL_SIZE:-8}"
      PERF_METRIC_ENABLED: "${PERF_METRIC_ENABLED:-0}"
      # ── Downstream service for /products HTTP proxy (Anser ServiceList) ──
      PRODUCTION_SERVICE_HOST: "${PRODUCTION_SERVICE_HOST:-10.1.1.207}"
      PRODUCTION_SERVICE_PORT: "${PRODUCTION_SERVICE_PORT:-8083}"
      PRODUCTION_SERVICE_HTTPS: "${PRODUCTION_SERVICE_HTTPS:-0}"
    # json-file rotation — without this, high-load runs (≥20k) lose ~44%
    # of perf log lines because the default driver caps at 10MB/file and the
    # analyzer's tail -n +offset misses pre-rotation rows.
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "5"
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      eventstoredb:
        condition: service_healthy
    networks:
      - anser_project_network

  # ── Vault PKI — service identity / mTLS CA (replaces SPIRE) ─────────
  vault:
    image: hashicorp/vault:1.18
    container_name: zt-vault
    command: ["vault", "server", "-dev", "-dev-root-token-id=zt-root", "-dev-listen-address=0.0.0.0:8200"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_DEV_ROOT_TOKEN_ID: "zt-root"
    ports:
      - "8200:8200"
    networks:
      - default
      - anser_project_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health?standbyok=true"]
      interval: 3s
      timeout: 2s
      retries: 30

  # One-shot: enable PKI (CA=zt.local), per-service roles + AppRole creds.
  vault-init:
    image: hashicorp/vault:1.18
    container_name: zt-vault-init
    entrypoint: ["/bin/sh", "/vault/init-pki.sh"]
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "zt-root"
      CREDS_DIR: "/vault/creds"
    volumes:
      - ./docker/vault-pki/init-pki.sh:/vault/init-pki.sh:ro
      - ./docker/vault-pki/creds:/vault/creds
    networks:
      - default
      - anser_project_network
    depends_on:
      vault:
        condition: service_healthy

  # vault-agent for the worker's mTLS CLIENT identity → renders into vault-out.
  vault-agent-worker:
    image: hashicorp/vault:1.18
    container_name: zt-vault-agent-worker
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "until [ -s /vault/creds/worker/secret_id ]; do sleep 0.3; done; chown -R vault:vault /vault/out; exec docker-entrypoint.sh agent -config=/vault/config.hcl"
    environment:
      VAULT_ADDR: "http://vault:8200"
    volumes:
      - ./docker/vault-pki/agent/worker.hcl:/vault/config.hcl:ro
      - ./docker/vault-pki/creds:/vault/creds:ro
      - vault-out:/vault/out
    networks:
      - default
      - anser_project_network
    healthcheck:
      test: ["CMD", "sh", "-c", "[ -s /vault/out/tls.crt ]"]
      interval: 3s
      timeout: 2s
      retries: 40
    depends_on:
      vault-init:
        condition: service_completed_successfully

  php-worker:
    build:
      context: .
      dockerfile: docker/php-openswoole/Dockerfile
    container_name: zt-php-worker
    command: ["bash", "/usr/local/bin/zt-worker-entrypoint.sh"]
    environment:
      APP_SERVICE_NAME: php-worker
      WORKER_PROCESSES: "${WORKER_PROCESSES:-4}"
      AMQP_HOST: "rabbitmq"
      AMQP_PORT: "5672"
      AMQP_USER: "zt"
      AMQP_PASSWORD: "ztpass"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "zt"
      RABBITMQ_PASS: "ztpass"
      PERF_METRIC_ENABLED: "${PERF_METRIC_ENABLED:-0}"
      # AMQP message persistence — see comment under `gateway` service.
      AMQP_PERSISTENT: "${AMQP_PERSISTENT:-0}"
      # ── Vault PKI mTLS to downstream services (transport-only identity) ──
      VAULT_MTLS_ENABLED: "${VAULT_MTLS_ENABLED:-0}"
      VAULT_TLS_CERT: "${VAULT_TLS_CERT:-/vault/out/tls.crt}"
      VAULT_TLS_KEY: "${VAULT_TLS_KEY:-/vault/out/tls.key}"
      VAULT_TLS_CA: "${VAULT_TLS_CA:-/vault/out/ca.crt}"
      IDENTITY_REQUIRED: "${IDENTITY_REQUIRED:-0}"
      MTLS_PORT: "${MTLS_PORT:-8443}"
      ORDER_SERVICE_HOST: "${ORDER_SERVICE_HOST:-10.1.1.210}"
      ORDER_SERVICE_PORT: "${ORDER_SERVICE_PORT:-8082}"
      PRODUCTION_SERVICE_HOST: "${PRODUCTION_SERVICE_HOST:-10.1.1.207}"
      PRODUCTION_SERVICE_PORT: "${PRODUCTION_SERVICE_PORT:-8083}"
      USER_SERVICE_HOST: "${USER_SERVICE_HOST:-10.1.1.214}"
      USER_SERVICE_PORT: "${USER_SERVICE_PORT:-8084}"
      # ── EventStoreDB ──
      EVENTSTOREDB_ENABLED: "1"
      EVENTSTOREDB_HOST: "eventstoredb"
      EVENTSTOREDB_PORT: "2113"
    # json-file rotation — see comment under `gateway` service. Worker is
    # where [perf-request-in] / [perf-saga-*] markers live.
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "5"
    volumes:
      # vault-agent renders per-service X.509 here; read-only for the worker.
      - vault-out:/vault/out:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      eventstoredb:
        condition: service_healthy
      vault-agent-worker:
        condition: service_healthy
    networks:
      - anser_project_network

volumes:
  rabbitmq_data:
  eventstoredb_data:
  vault-out:

networks:
  anser_project_network:
    external: true
