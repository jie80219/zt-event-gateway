name: zt-event-gateway
services:

  # ── Infrastructure ──────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: zt-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - anser_project_network

  eventstoredb:
    container_name: eventstoredb
    image: eventstore/eventstore:latest
    environment:
      EVENTSTORE_CLUSTER_SIZE: 1
      EVENTSTORE_RUN_PROJECTIONS: All
      EVENTSTORE_START_STANDARD_PROJECTIONS: "true"
      EVENTSTORE_INSECURE: "true"
      EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: "true"
    ports:
      - '1113:1113'
      - '2113:2113'
    networks:
      - anser_project_network

  # ── Keycloak + backing store ────────────────────────────────────

  keycloak-db:
    image: postgres:16
    container_name: zt-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - anser_project_network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: zt-keycloak
    command:
      - "start-dev"
      - "--import-realm"
      - "--http-port=8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/realm-zt.json:/opt/keycloak/data/import/realm-zt.json:ro
    ports:
      - "8180:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # Keycloak 25 exposes /health/ready on the management port (9000) but
      # the distribution defaults to running it on the same port as the HTTP
      # listener when KC_HEALTH_ENABLED=true in start-dev mode.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/zt HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -E 'HTTP/1.[01] [23]'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - anser_project_network

  # ── Application (OpenSwoole) ────────────────────────────────────

  keycloak-watcher:
    build:
      context: .
      dockerfile: docker/php-openswoole/Dockerfile
    container_name: zt-keycloak-watcher
    command: ["php", "bin/keycloak-watcher.php"]
    environment:
      KEYCLOAK_ENABLED: "1"
      KEYCLOAK_ISSUER: "http://keycloak:8080/realms/zt"
      KEYCLOAK_CLIENT_ID: "gateway"
      KEYCLOAK_CLIENT_SECRET: "gateway-dev-secret"
      KEYCLOAK_SHM_DIR: "/tmp/keycloak-shared"
      KEYCLOAK_TOKEN_REFRESH_SKEW: "30"
      KEYCLOAK_JWKS_REFRESH_INTERVAL: "300"
      KEYCLOAK_WATCHER_HEALTH_ADDR: "0.0.0.0:9901"
    volumes:
      - keycloak-shared:/tmp/keycloak-shared
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "meta=/tmp/keycloak-shared/meta.json; [ -f $$meta ] && grep -q '\"token_state\":\"ready\"' $$meta && grep -q '\"jwks_state\":\"ready\"' $$meta && now=$$(date +%s) && upd=$$(grep -oE '\"updated_at\":[[:space:]]*[0-9]+' $$meta | grep -oE '[0-9]+') && [ -n \"$$upd\" ] && [ $$((now - upd)) -lt 900 ]"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - anser_project_network

  gateway:
    build:
      context: .
      dockerfile: docker/php-openswoole/Dockerfile
    container_name: zt-gateway
    command: ["php", "bin/gateway.php"]
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      GATEWAY_WORKERS: "2"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "zt"
      RABBITMQ_PASS: "ztpass"
      EVENTSTOREDB_HOST: eventstoredb
      EVENTSTOREDB_PORT: 2113
      KEYCLOAK_ENABLED: "1"
      KEYCLOAK_ISSUER: "http://keycloak:8080/realms/zt"
      KEYCLOAK_CLIENT_ID: "gateway"
      KEYCLOAK_CLIENT_SECRET: "gateway-dev-secret"
      KEYCLOAK_SHM_DIR: "/tmp/keycloak-shared"
      KEYCLOAK_STALE_THRESHOLD_SECS: "900"
    volumes:
      - keycloak-shared:/tmp/keycloak-shared:ro
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      eventstoredb:
        condition: service_healthy
      keycloak-watcher:
        condition: service_healthy
    networks:
      - anser_project_network

  php-worker:
    build:
      context: .
      dockerfile: docker/php-openswoole/Dockerfile
    container_name: zt-php-worker
    command: ["php", "bin/worker.php"]
    environment:
      APP_SERVICE_NAME: php-worker
      AMQP_HOST: "rabbitmq"
      AMQP_PORT: "5672"
      AMQP_USER: "zt"
      AMQP_PASSWORD: "ztpass"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "zt"
      RABBITMQ_PASS: "ztpass"
      KEYCLOAK_ENABLED: "1"
      KEYCLOAK_ISSUER: "http://keycloak:8080/realms/zt"
      KEYCLOAK_CLIENT_ID: "worker"
      KEYCLOAK_CLIENT_SECRET: "worker-dev-secret"
      KEYCLOAK_SHM_DIR: "/tmp/keycloak-shared"
      KEYCLOAK_STALE_THRESHOLD_SECS: "900"
      KEYCLOAK_AUDIENCE_ORDER: "order-service"
      KEYCLOAK_AUDIENCE_PRODUCTION: "production-service"
      KEYCLOAK_AUDIENCE_USER: "user-service"
      ORDER_SERVICE_HOST: "host.docker.internal"
      ORDER_SERVICE_PORT: "8082"
      PRODUCTION_SERVICE_HOST: "host.docker.internal"
      PRODUCTION_SERVICE_PORT: "8083"
      USER_SERVICE_HOST: "host.docker.internal"
      USER_SERVICE_PORT: "8084"
      EVENTSTOREDB_ENABLED: "1"
      EVENTSTOREDB_HOST: "eventstoredb"
      EVENTSTOREDB_PORT: "2113"
    volumes:
      - keycloak-shared:/tmp/keycloak-shared:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      eventstoredb:
        condition: service_healthy
      keycloak-watcher:
        condition: service_healthy
    networks:
      - anser_project_network

volumes:
  rabbitmq_data:
  eventstoredb_data:
  keycloak_db_data:
  keycloak-shared:

networks:
  anser_project_network:
    external: true
