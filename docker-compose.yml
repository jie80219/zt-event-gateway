name: zt-event-gateway
services:

  # ── Infrastructure ──────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: zt-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - anser_project_network

  eventstoredb:
    container_name: eventstoredb
    image: eventstore/eventstore:latest
    environment:
        EVENTSTORE_CLUSTER_SIZE: 1
        EVENTSTORE_RUN_PROJECTIONS: All
        EVENTSTORE_START_STANDARD_PROJECTIONS: "true"
        EVENTSTORE_INSECURE: "true"
        EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: "true"
    ports:
        - '1113:1113' # TCP 客戶端通信
        - '2113:2113' # HTTP API 接口
    networks:
        - anser_project_network

  # ── Keycloak + backing store (profile: keycloak) ────────────────
  # Only started when COMPOSE_PROFILES contains "keycloak" (or "all").
  # Default `docker compose up` keeps the SPIFFE-only stack untouched.

  keycloak-db:
    image: postgres:16
    container_name: zt-keycloak-db
    profiles: ["keycloak", "all"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - anser_project_network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: zt-keycloak
    profiles: ["keycloak", "all"]
    command:
      - "start-dev"
      - "--import-realm"
      - "--http-port=8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/realm-zt.json:/opt/keycloak/data/import/realm-zt.json:ro
    ports:
      - "8180:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/zt HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -E 'HTTP/1.[01] [23]'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - anser_project_network

  keycloak-watcher:
    build:
      context: .
      dockerfile: docker/php-openswoole/Dockerfile
    container_name: zt-keycloak-watcher
    profiles: ["keycloak", "all"]
    command: ["php", "bin/keycloak-watcher.php"]
    environment:
      KEYCLOAK_ENABLED: "1"
      KEYCLOAK_ISSUER: "http://keycloak:8080/realms/zt"
      KEYCLOAK_CLIENT_ID: "gateway"
      KEYCLOAK_CLIENT_SECRET: "gateway-dev-secret"
      KEYCLOAK_SHM_DIR: "/tmp/keycloak-shared"
      KEYCLOAK_TOKEN_REFRESH_SKEW: "30"
      KEYCLOAK_JWKS_REFRESH_INTERVAL: "300"
      KEYCLOAK_WATCHER_HEALTH_ADDR: "0.0.0.0:9901"
    volumes:
      - keycloak-shared:/tmp/keycloak-shared
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "meta=/tmp/keycloak-shared/meta.json; [ -f $$meta ] && grep -q '\"token_state\":\"ready\"' $$meta && grep -q '\"jwks_state\":\"ready\"' $$meta && now=$$(date +%s) && upd=$$(grep -oE '\"updated_at\":[[:space:]]*[0-9]+' $$meta | grep -oE '[0-9]+') && [ -n \"$$upd\" ] && [ $$((now - upd)) -lt 900 ]"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - anser_project_network

  # ── SPIFFE / SPIRE ──────────────────────────────────────────────

  spire-server:
    image: ghcr.io/spiffe/spire-server:1.12.0
    container_name: zt-spire-server
    user: "0:0"
    command:
      - -config
      - /opt/spire/conf/server/server.conf
    volumes:
      - ./spiffe/spire-server-e2e/server.conf:/opt/spire/conf/server/server.conf:ro
      - ./spiffe/certs/agent-ca.crt.pem:/opt/spire/conf/server/agent-ca.crt.pem:ro
      - spire-server-socket:/tmp/spire-server/private
      - spire-server-data:/tmp/spire-server/data
    ports:
      # Publish gRPC port so off-host SPIRE Agents can attest against
      # this server over the LAN (kept for multi-host scenarios).
      - "8081:8081"
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks:
      - anser_project_network

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.12.0
    container_name: zt-spire-agent
    user: "0:0"
    command:
      - -config
      - /opt/spire/conf/agent/agent.conf
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - ./spiffe/spire-agent-e2e/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - ./spiffe/certs/agent.key.pem:/opt/spire/conf/agent/agent.key.pem:ro
      - ./spiffe/certs/agent.crt.pem:/opt/spire/conf/agent/agent.crt.pem:ro
      - spire-agent-sockets:/run/spire/sockets
      - spire-agent-data:/opt/spire/data/agent
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/run/spire/sockets/agent.sock"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks:
      - anser_project_network

  workload-registrar:
    build:
      context: .
      dockerfile: docker/workload-registrar/Dockerfile
    container_name: zt-workload-registrar
    command: ["/bin/sh", "/opt/spire/conf/scripts/register-workloads-internal.sh"]
    environment:
      REGISTER_INTERVAL: "60"
    volumes:
      - ./spiffe/scripts/register-workloads-internal.sh:/opt/spire/conf/scripts/register-workloads-internal.sh:ro
      - spire-server-socket:/tmp/spire-server/private:ro
      # Bind-mount each agent's cert dir so the registrar can compute its
      # x509pop fingerprint and use the correct parent ID per SPIFFE ID.
      # Missing dirs (microservice stack not yet started) are tolerated —
      # the registrar's 60s loop converges once the cert file appears.
      - ./spiffe/certs:/agent-certs/zt:ro
      - ./Services/Order_service/spiffe/certs:/agent-certs/order:ro
      - ./Services/Production_service/spiffe/certs:/agent-certs/production:ro
      - ./Services/User_service/spiffe/certs:/agent-certs/user:ro
    depends_on:
      spire-server:
        condition: service_healthy
      spire-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/registrar-ready"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 5s
    restart: unless-stopped
    networks:
      - anser_project_network

  # ── Application (OpenSwoole) ────────────────────────────────────

  spiffe-watcher:
    pid: "service:spire-agent"
    build:
      context: .
      dockerfile: docker/php-openswoole/Dockerfile
    container_name: zt-spiffe-watcher
    command: ["php", "bin/spiffe-watcher.php"]
    environment:
      SPIFFE_ENDPOINT_SOCKET: "unix:/run/spire/sockets/agent.sock"
      SPIFFE_PEM_DIR: "/tmp/spiffe-certs"
      SPIFFE_SHM_DIR: "/tmp/spiffe-shared"
      SPIFFE_WATCHER_HEALTH_ADDR: "0.0.0.0:9901"
      # Expose the same staleness threshold as gateway/worker so in-process
      # logs and the healthcheck below share one tunable.
      SPIFFE_STALE_THRESHOLD_SECS: "700"
    volumes:
      - spire-agent-sockets:/run/spire/sockets:ro
      - spiffe-certs:/tmp/spiffe-certs
      - spiffe-shared:/tmp/spiffe-shared
    depends_on:
      spire-agent:
        condition: service_healthy
      workload-registrar:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Staleness-based liveness: meta.json must exist, x509_state must be
      # "ready", AND updated_at must be within 700s of now. If the watcher's
      # gRPC stream wedges silently, updated_at stops advancing and Docker
      # restarts the container (matched to SVID TTL=600s — agent renews at
      # ~300s, so >700s without an update means something is wrong).
      test: ["CMD-SHELL", "meta=/tmp/spiffe-shared/meta.json; [ -f $$meta ] && grep -q '\"x509_state\":\"ready\"' $$meta && now=$$(date +%s) && upd=$$(grep -oE '\"updated_at\":[[:space:]]*[0-9]+' $$meta | grep -oE '[0-9]+') && [ -n \"$$upd\" ] && [ $$((now - upd)) -lt 700 ]"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - anser_project_network

  gateway:
    pid: "service:spire-agent"
    build:
      context: .
      dockerfile: docker/php-openswoole/Dockerfile
    container_name: zt-gateway
    command: ["php", "bin/gateway.php"]
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      GATEWAY_WORKERS: "${GATEWAY_WORKERS:-32}"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "zt"
      RABBITMQ_PASS: "ztpass"
      EVENTSTOREDB_HOST: eventstoredb
      EVENTSTOREDB_PORT: 2113
      SPIFFE_ID: "spiffe://zt.local/php-gateway"
      SPIFFE_ENDPOINT_SOCKET: "unix:/run/spire/sockets/agent.sock"
      SPIFFE_PEM_DIR: "/tmp/spiffe-certs"
      SPIFFE_SHM_DIR: "/tmp/spiffe-shared"
      WORKER_SPIFFE_ID: "spiffe://zt.local/php-worker"
      SPIFFE_TRUST_DOMAIN: "zt.local"
      # Tightened from default 7200s — must stay > SVID renewal interval
      # (~300s at TTL=600) + slack, but low enough to surface wedged
      # watcher quickly in logs.
      SPIFFE_STALE_THRESHOLD_SECS: "700"
      LSVID_ENABLED: "1"
      LSVID_REQUIRED: "1"
      LSVID_TTL_SECONDS: "1800"
      LSVID_LOG_PAYLOAD: "0"
      PERF_METRIC_ENABLED: "${PERF_METRIC_ENABLED:-0}"
      # AMQP message persistence — default 0 (transient, latency-optimised).
      # Set AMQP_PERSISTENT=1 to write every message to disk; queues remain
      # durable either way, so broker restart only loses in-flight messages.
      AMQP_PERSISTENT: "${AMQP_PERSISTENT:-0}"
      GATEWAY_AMQP_POOL_SIZE: "${GATEWAY_AMQP_POOL_SIZE:-8}"
      # ── Downstream service for /products HTTP proxy (Anser ServiceList) ──
      PRODUCTION_SERVICE_HOST: "${PRODUCTION_SERVICE_HOST:-10.1.1.207}"
      PRODUCTION_SERVICE_PORT: "${PRODUCTION_SERVICE_PORT:-8083}"
      PRODUCTION_SERVICE_HTTPS: "${PRODUCTION_SERVICE_HTTPS:-0}"
      # ── Keycloak (default ON for feat/spiffe-keycloak — must boot with --profile keycloak) ──
      KEYCLOAK_ENABLED: "${KEYCLOAK_ENABLED:-1}"
      KEYCLOAK_ISSUER: "${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/zt}"
      KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID:-gateway}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:-gateway-dev-secret}"
      KEYCLOAK_SHM_DIR: "${KEYCLOAK_SHM_DIR:-/tmp/keycloak-shared}"
      KEYCLOAK_STALE_THRESHOLD_SECS: "${KEYCLOAK_STALE_THRESHOLD_SECS:-900}"
      # ── Keycloak ingress JWT (north-south validation) ──
      KEYCLOAK_INGRESS_ENABLED: "${KEYCLOAK_INGRESS_ENABLED:-1}"
      KEYCLOAK_INGRESS_AUDIENCE: "${KEYCLOAK_INGRESS_AUDIENCE:-gateway}"
      KEYCLOAK_INGRESS_SKIP_PATHS: "${KEYCLOAK_INGRESS_SKIP_PATHS:-/api/health,/}"
    volumes:
      - spire-agent-sockets:/run/spire/sockets:ro
      - spiffe-certs:/tmp/spiffe-certs:ro
      - spiffe-shared:/tmp/spiffe-shared:ro
      # Read-only access to the keycloak-watcher SHM. Volume is shared
      # (created at compose level); when the keycloak profile is not active,
      # the directory is empty and KeycloakBootstrap falls back gracefully.
      - keycloak-shared:/tmp/keycloak-shared:ro
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      spire-agent:
        condition: service_healthy
      eventstoredb:
        condition: service_healthy
      spiffe-watcher:
        condition: service_healthy
    networks:
      - anser_project_network

  php-worker:
    pid: "service:spire-agent"
    build:
      context: .
      dockerfile: docker/php-openswoole/Dockerfile
    container_name: zt-php-worker
    command: ["bash", "/usr/local/bin/zt-worker-entrypoint.sh"]
    environment:
      APP_SERVICE_NAME: php-worker
      WORKER_PROCESSES: "${WORKER_PROCESSES:-4}"
      AMQP_HOST: "rabbitmq"
      AMQP_PORT: "5672"
      AMQP_USER: "zt"
      AMQP_PASSWORD: "ztpass"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "zt"
      RABBITMQ_PASS: "ztpass"
      SPIFFE_ID: "spiffe://zt.local/php-worker"
      SPIFFE_ENDPOINT_SOCKET: "unix:/run/spire/sockets/agent.sock"
      SPIFFE_PEM_DIR: "/tmp/spiffe-certs"
      SPIFFE_SHM_DIR: "/tmp/spiffe-shared"
      DOWNSTREAM_SPIFFE_ID: "spiffe://zt.local/php-worker"
      SPIFFE_TRUST_DOMAIN: "zt.local"
      SPIFFE_STALE_THRESHOLD_SECS: "700"
      LSVID_ENABLED: "1"
      LSVID_REQUIRED: "1"
      LSVID_TTL_SECONDS: "1800"
      LSVID_LOG_PAYLOAD: "0"
      PERF_METRIC_ENABLED: "${PERF_METRIC_ENABLED:-0}"
      # AMQP message persistence — see comment under `gateway` service.
      AMQP_PERSISTENT: "${AMQP_PERSISTENT:-0}"
      # ── mTLS to downstream services ──
      SPIFFE_MTLS_ENABLED: "${SPIFFE_MTLS_ENABLED:-0}"
      MTLS_PORT: "${MTLS_PORT:-8443}"
      ORDER_SERVICE_HOST: "${ORDER_SERVICE_HOST:-10.1.1.210}"
      ORDER_SERVICE_PORT: "${ORDER_SERVICE_PORT:-8082}"
      PRODUCTION_SERVICE_HOST: "${PRODUCTION_SERVICE_HOST:-10.1.1.207}"
      PRODUCTION_SERVICE_PORT: "${PRODUCTION_SERVICE_PORT:-8083}"
      USER_SERVICE_HOST: "${USER_SERVICE_HOST:-10.1.1.214}"
      USER_SERVICE_PORT: "${USER_SERVICE_PORT:-8084}"
      ORDER_SPIFFE_ID: "spiffe://zt.local/order-service"
      PRODUCTION_SPIFFE_ID: "spiffe://zt.local/production-service"
      USER_SPIFFE_ID: "spiffe://zt.local/user-service"
      # ── EventStoreDB ──
      EVENTSTOREDB_ENABLED: "1"
      EVENTSTOREDB_HOST: "eventstoredb"
      EVENTSTOREDB_PORT: "2113"
      # ── Keycloak (default ON for feat/spiffe-keycloak — must boot with --profile keycloak) ──
      KEYCLOAK_ENABLED: "${KEYCLOAK_ENABLED:-1}"
      KEYCLOAK_ISSUER: "${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/zt}"
      KEYCLOAK_CLIENT_ID: "${KEYCLOAK_WORKER_CLIENT_ID:-worker}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_WORKER_CLIENT_SECRET:-worker-dev-secret}"
      KEYCLOAK_SHM_DIR: "${KEYCLOAK_SHM_DIR:-/tmp/keycloak-shared}"
      KEYCLOAK_STALE_THRESHOLD_SECS: "${KEYCLOAK_STALE_THRESHOLD_SECS:-900}"
      KEYCLOAK_AUDIENCE_ORDER: "${KEYCLOAK_AUDIENCE_ORDER:-order-service}"
      KEYCLOAK_AUDIENCE_PRODUCTION: "${KEYCLOAK_AUDIENCE_PRODUCTION:-production-service}"
      KEYCLOAK_AUDIENCE_USER: "${KEYCLOAK_AUDIENCE_USER:-user-service}"
    volumes:
      - spire-agent-sockets:/run/spire/sockets:ro
      - spiffe-certs:/tmp/spiffe-certs:ro
      - spiffe-shared:/tmp/spiffe-shared:ro
      - keycloak-shared:/tmp/keycloak-shared:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      spire-agent:
        condition: service_healthy
      eventstoredb:
        condition: service_healthy
      spiffe-watcher:
        condition: service_healthy
    networks:
      - anser_project_network

volumes:
  rabbitmq_data:
  eventstoredb_data:
  spire-agent-sockets:
  spire-server-socket:
  spire-server-data:
  spire-agent-data:
  spiffe-certs:
  spiffe-shared:
  keycloak_db_data:
  keycloak-shared:

networks:
  anser_project_network:
    external: true
