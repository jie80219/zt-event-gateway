name: zt-event-gateway
services:

  # ── Infrastructure ──────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: zt-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - anser_project_network

  eventstoredb:
    container_name: eventstoredb
    image: eventstore/eventstore:latest
    environment:
        EVENTSTORE_CLUSTER_SIZE: 1
        EVENTSTORE_RUN_PROJECTIONS: All
        EVENTSTORE_START_STANDARD_PROJECTIONS: "true"
        EVENTSTORE_INSECURE: "true"
        EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: "true"
    ports:
        - '1113:1113'
        - '2113:2113'
    networks:
        - anser_project_network

  # ── Application (OpenSwoole) ────────────────────────────────────

  gateway:
    build:
      context: .
      dockerfile: docker/php-openswoole/Dockerfile
    container_name: zt-gateway
    command: ["php", "bin/gateway.php"]
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      GATEWAY_WORKERS: "2"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "zt"
      RABBITMQ_PASS: "ztpass"
      EVENTSTOREDB_HOST: eventstoredb
      EVENTSTOREDB_PORT: 2113
      PERF_METRIC_ENABLED: "${PERF_METRIC_ENABLED:-0}"
      # ── Downstream service for /products HTTP proxy (Anser ServiceList) ──
      PRODUCTION_SERVICE_HOST: "${PRODUCTION_SERVICE_HOST:-10.1.1.207}"
      PRODUCTION_SERVICE_PORT: "${PRODUCTION_SERVICE_PORT:-8083}"
      PRODUCTION_SERVICE_HTTPS: "${PRODUCTION_SERVICE_HTTPS:-0}"
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      eventstoredb:
        condition: service_healthy
    networks:
      - anser_project_network

  php-worker:
    build:
      context: .
      dockerfile: docker/php-openswoole/Dockerfile
    container_name: zt-php-worker
    command: ["php", "bin/worker.php"]
    environment:
      APP_SERVICE_NAME: php-worker
      AMQP_HOST: "rabbitmq"
      AMQP_PORT: "5672"
      AMQP_USER: "zt"
      AMQP_PASSWORD: "ztpass"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "zt"
      RABBITMQ_PASS: "ztpass"
      PERF_METRIC_ENABLED: "${PERF_METRIC_ENABLED:-0}"
      ORDER_SERVICE_HOST: "${ORDER_SERVICE_HOST:-10.1.1.210}"
      ORDER_SERVICE_PORT: "${ORDER_SERVICE_PORT:-8082}"
      PRODUCTION_SERVICE_HOST: "${PRODUCTION_SERVICE_HOST:-10.1.1.207}"
      PRODUCTION_SERVICE_PORT: "${PRODUCTION_SERVICE_PORT:-8083}"
      USER_SERVICE_HOST: "${USER_SERVICE_HOST:-10.1.1.214}"
      USER_SERVICE_PORT: "${USER_SERVICE_PORT:-8084}"
      EVENTSTOREDB_ENABLED: "1"
      EVENTSTOREDB_HOST: "eventstoredb"
      EVENTSTOREDB_PORT: "2113"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      eventstoredb:
        condition: service_healthy
    networks:
      - anser_project_network

volumes:
  rabbitmq_data:
  eventstoredb_data:

networks:
  anser_project_network:
    external: true
